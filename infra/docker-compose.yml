# WaterCheck local dev stack. Usage (from infra/):
#   cp .env.example .env    # then edit values
#   docker compose up -d --build
#   curl http://localhost/health
name: watercheck

services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage (ADR-003: SeaweedFS replaces MinIO).
  storage:
    image: chrislusf/seaweedfs:4.48
    # S3 access needs the key pair from .env (ADR-003, ADR-012); the API is
    # the only client and storage is never exposed beyond 127.0.0.1.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"api","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024
    environment:
      S3_ACCESS_KEY: ${WC_S3_ACCESS_KEY}
      S3_SECRET_KEY: ${WC_S3_SECRET_KEY}
    volumes:
      - storage-data:/data
    ports:
      - "127.0.0.1:8333:8333"

  # One-shot: migrate as owner, (re)create the restricted API role, load the
  # seed. The API starts only after this succeeds (ADR-009).
  migrate:
    build: ../backend
    command:
      - sh
      - -c
      - >-
        until python -c "import os; from sqlalchemy import create_engine; engine = create_engine(os.environ['WC_MIGRATION_DATABASE_URL']); connection = engine.connect(); connection.close(); engine.dispose()";
        do echo "Waiting for PostgreSQL to accept connections..."; sleep 2; done &&
        alembic upgrade head &&
        python -m app.cli create-api-role --password "$${API_DB_PASSWORD}" &&
        python -m app.seed --seed-dir /seed
    environment:
      WC_MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
    volumes:
      - ../infra/seed:/seed:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ../backend
    environment: &api_env
      WC_ENVIRONMENT: ${WC_ENVIRONMENT}
      WC_LOG_LEVEL: ${WC_LOG_LEVEL}
      WC_DATABASE_URL: postgresql+asyncpg://watercheck_api:${API_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      WC_JWT_SECRET: ${WC_JWT_SECRET}
      WC_SECRET_KEY: ${WC_SECRET_KEY}
      WC_S3_ENDPOINT_URL: http://storage:8333
      WC_S3_ACCESS_KEY: ${WC_S3_ACCESS_KEY}
      WC_S3_SECRET_KEY: ${WC_S3_SECRET_KEY}
      # Notifications (ADR-013): Mailpit in dev; SMS keys only when set.
      WC_SMTP_HOST: ${WC_SMTP_HOST:-mailpit}
      WC_SMTP_PORT: ${WC_SMTP_PORT:-1025}
      WC_SMTP_FROM: ${WC_SMTP_FROM:-WaterCheck <no-reply@watercheck.local>}
      WC_SMS_PROVIDER: ${WC_SMS_PROVIDER:-}
      WC_SMS_USERNAME: ${WC_SMS_USERNAME:-}
      WC_SMS_API_KEY: ${WC_SMS_API_KEY:-}
      WC_SMS_WEBHOOK_TOKEN: ${WC_SMS_WEBHOOK_TOKEN}
      # Map background (ADR-014), built by tools/build_tiles.ps1.
      WC_TILES_PATH: /data/tiles/area.mbtiles
    volumes:
      - ./tiles:/data/tiles:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Placeholder until P8 (notifications, escalations, SMS, PDF jobs).
  worker:
    build: ../backend
    command: ["python", "-m", "app.worker"]
    environment: *api_env
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  caddy:
    image: caddy:2.11
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    # Dev routing by default (localhost: /console/, /collect/); the VM sets
    # WC_CADDYFILE=Caddyfile.prod in .env for the HTTPS domains.
    environment:
      WC_WEB_HOST: ${WC_WEB_HOST:-watercheck.cooptconnect.app}
      WC_API_HOST: ${WC_API_HOST:-api.watercheck.cooptconnect.app}
    volumes:
      - ./caddy/${WC_CADDYFILE:-Caddyfile.dev}:/etc/caddy/Caddyfile:ro
      - ../apps/console/build/web:/srv/console:ro
      - ../apps/collect/build/web:/srv/collect:ro
      - caddy-data:/data
    depends_on:
      api:
        condition: service_healthy

  # Map images with place names for all of Uganda (ADR-014), rendered on
  # demand from infra/tiles/uganda.mbtiles (tools/build_map.ps1 -Vector).
  # Behind Caddy at /tiles/.
  tiles:
    image: maptiler/tileserver-gl:v5.6.0
    # Our style (tiles-config/): OpenMapTiles basic, with labels read from
    # `name:latin`, the field tilemaker writes.
    command: ["--config", "/config/config.json", "--public_url", "/tiles/"]
    volumes:
      - ./tiles:/data:ro
      - ./tiles-config:/config:ro
    mem_limit: 1g
    restart: unless-stopped

  # Road routes for the maps (ADR-021): Valhalla for all of Uganda, one
  # service for motorbike/car and walking, from infra/routing/valhalla
  # (tools/build_routes.ps1). It reads its tiles from disk, so it needs
  # little memory. Behind Caddy at /route/. Started with the `routing`
  # profile once the data is built: docker compose --profile routing up -d
  routing:
    image: ghcr.io/valhalla/valhalla:3.5.1
    command: ["valhalla_service", "/data/valhalla.json", "2"]
    volumes:
      - ./routing/valhalla:/data:ro
    mem_limit: 512m
    restart: unless-stopped
    profiles: [routing]

  # Dev mail catcher: SMTP on 1025, web inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"

  # Chaos tests (P6): a fault-injecting proxy in front of Caddy. Only with
  # `docker compose --profile chaos up -d`; the tests create the proxy
  # (localhost:18080 → caddy:80) and its faults through the API on 8474.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: [chaos]
    ports:
      - "127.0.0.1:8474:8474"
      - "127.0.0.1:18080:18080"
    depends_on:
      - caddy

volumes:
  db-data:
  storage-data:
  caddy-data:
