<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FieldQuire is being updated</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0F172A; color: #F1F5F9;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { min-height: 100%; display: flex; align-items: center; justify-content: center;
      box-sizing: border-box; padding: 24px; }
    section { max-width: 460px; text-align: center; line-height: 1.5; }
    h1 { font-size: 24px; margin: 0 0 12px; }
    p { margin: 0 0 12px; color: #CBD5E1; }
    button { margin-top: 8px; padding: 10px 24px; border: 0; border-radius: 8px;
      background: #38BDF8; color: #0F172A; font-size: 16px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>FieldQuire is being updated</h1>
      <p>This usually takes a few minutes. Nothing is lost.</p>
      <p>Collectors can keep filling forms in the Collect app; their work is sent once the update is done.</p>
      <button onclick="location.reload()">Try again</button>
    </section>
  </main>
</body>
</html>
