name: flutter

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run melos run format:check
      - run: dart run melos run analyze
      - run: dart run melos run test:dart
      - run: dart run melos run coverage:domain
      # Goldens are generated on Windows; Linux font rendering differs.
      - run: dart run melos exec --flutter --dir-exists=test -- flutter test --no-pub --exclude-tags golden
