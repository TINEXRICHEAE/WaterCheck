name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The runner's disk (about 14 GB free) fills up during the debug
      # build; drop preinstalled toolchains this job never uses (~20 GB).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /opt/ghc             /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/powershell             /usr/share/swift /usr/local/julia* /opt/az
          docker system prune -af > /dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # The runner has about 7 GB of RAM; the project's Gradle settings ask
      # for an 8 GB heap (fine on a workstation). The user-level file wins.
      - name: Fit Gradle to the runner
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.daemon=false
          kotlin.daemon.jvmargs=-Xmx1g
          PROPS
      - id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      # One CPU type (most phones) keeps the CI build small; release builds
      # for the pilot carry all of them (P12).
      - run: flutter build apk --debug --target-platform android-arm64
        working-directory: apps/collect
      - run: df -h /
      - uses: actions/upload-artifact@v4
        with:
          name: collect-debug-apk
          path: apps/collect/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  console-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --base-href /console/ --no-web-resources-cdn
        working-directory: apps/console
      - uses: actions/upload-artifact@v4
        with:
          name: console-web
          path: apps/console/build/web
          retention-days: 14
