# Regenerate after an API change:
#   cd backend && uv run python -m app.openapi
#   cd packages/api_client && dart run swagger_parser && dart run build_runner build
swagger_parser:
  schema_path: ../../docs/api/openapi.yaml
  output_directory: lib/src/generated
  name: watercheck_api
  language: dart
  json_serializer: json_serializable
  root_client: true
  root_client_name: WaterCheckApi
  put_clients_in_folder: true
  enums_to_json: true
  unknown_enum_value: false
