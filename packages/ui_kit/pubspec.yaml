name: ui_kit
description: Shared WaterCheck UI (theme, status badges, adaptive scaffolds).
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  domain:
    path: ../domain
  intl: ^0.20.3
  fl_chart: ^1.2.0
  flutter_map: 8.3.2
  latlong2: 0.10.1
  dio: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  # The WaterCheck icon (design/watercheck-icons), 1x/2x/3x.
  assets:
    - assets/watercheck.png
    - assets/legal/
