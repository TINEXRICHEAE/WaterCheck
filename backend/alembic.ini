[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# The URL comes from WC_MIGRATION_DATABASE_URL (owner role); see env.py.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
