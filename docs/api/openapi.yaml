openapi: 3.1.0
info:
  title: WaterCheck API
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Health
      description: Liveness probe used by Caddy, uptime checks and the client sync
        ping.
      operationId: health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health
  /v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      operationId: login
      parameters:
      - name: X-Token-Transport
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Token-Transport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Refresh
      description: 'With a token in the body: from secure storage (Windows, Android).

        Without one: the web cookie (a `{}` body counts as none).'
      operationId: refresh
      parameters:
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Csrf-Token
      - name: wc_refresh
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Wc Refresh
      - name: wc_csrf
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Wc Csrf
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/RefreshRequest'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/change-password:
    post:
      tags:
      - auth
      summary: Change Password
      operationId: change_password
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Token-Transport
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Token-Transport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      operationId: logout
      parameters:
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Csrf-Token
      - name: wc_refresh
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Wc Refresh
      - name: wc_csrf
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Wc Csrf
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/RefreshRequest'
              - type: 'null'
              title: Body
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/password-help:
    post:
      tags:
      - auth
      summary: Password Help
      description: '"Forgot password": asks the IT admin for a new temporary password.

        Answers the same for unknown usernames.'
      operationId: password_help
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordHelpRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/me:
    get:
      tags:
      - auth
      summary: Me
      operationId: me
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
      security:
      - HTTPBearer: []
  /v1/me/appearance:
    put:
      tags:
      - auth
      summary: Set Appearance
      operationId: set_appearance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppearanceIn'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/me/preferences:
    put:
      tags:
      - auth
      summary: Set Preferences
      operationId: set_preferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesIn'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/installations/activate:
    post:
      tags:
      - installations
      summary: Activate
      operationId: activate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/installations/register:
    post:
      tags:
      - installations
      summary: Register
      description: A device registers itself, no code needed (ADR-024).
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/installations/me:
    get:
      tags:
      - installations
      summary: Installation Me
      operationId: installation_me
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallationMe'
  /v1/admin/activation-codes:
    get:
      tags:
      - admin
      summary: Activation Codes
      description: Recent codes; the codes themselves were shown once and are not
        stored.
      operationId: activation_codes
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ActivationCodeOut'
                type: array
                title: Response Activation Codes
      security:
      - HTTPBearer: []
    post:
      tags:
      - installations
      summary: New Activation Code
      operationId: new_activation_code
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCodeRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewCodeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/admin/installations/{installation_id}/revoke:
    post:
      tags:
      - installations
      summary: Revoke Installation
      operationId: revoke_installation
      security:
      - HTTPBearer: []
      parameters:
      - name: installation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Installation Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/reference/catalogue:
    get:
      tags:
      - reference
      summary: Catalogue
      operationId: catalogue
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalogue'
  /v1/reference/profiles:
    get:
      tags:
      - reference
      summary: Reference Profiles
      description: Published profiles as seed-format documents (custom ones come via
        sync).
      operationId: reference_profiles
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                type: array
                title: Response Reference Profiles
  /v1/reference/tester-profiles:
    get:
      tags:
      - reference
      summary: Tester Profiles
      operationId: tester_profiles
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                type: array
                title: Response Tester Profiles
  /v1/reference/response-cards:
    get:
      tags:
      - reference
      summary: Response Cards
      operationId: response_cards
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                type: array
                title: Response Response Cards
  /v1/reference/config/{key}:
    get:
      tags:
      - reference
      summary: Config
      operationId: config
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          title: Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Config
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/reference/admin-units:
    get:
      tags:
      - reference
      summary: Admin Units
      operationId: admin_units
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AdminUnitOut'
                type: array
                title: Response Admin Units
  /v1/sources/search:
    get:
      tags:
      - reference
      summary: Search Sources
      description: 'Sources anywhere, by code, name or village (ADR-019): a phone
        finds

        sources beyond the districts it holds, then syncs that district.'
      operationId: search_sources
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          title: Q
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 30
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SourceHit'
                title: Response Search Sources
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/places/search:
    get:
      tags:
      - reference
      summary: Search Places
      description: 'Places anywhere in Uganda by name: official areas, places added
        from

        devices, and the map''s villages, trading centres and neighbourhoods

        with the sub-county they lie in. Names starting with the text come

        first, then the nearest to `near_lat`/`near_lon` when given.'
      operationId: search_places
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          title: Q
      - name: near_lat
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          title: Near Lat
      - name: near_lon
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          title: Near Lon
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlaceHit'
                title: Response Search Places
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/places/locate:
    get:
      tags:
      - reference
      summary: Locate Place
      description: 'The sub-county (and its district) a point lies in, from the official

        boundaries (ADR-023). 404 outside Uganda or before the shapes load.'
      operationId: locate_place
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          title: Lat
      - name: lon
        in: query
        required: true
        schema:
          type: number
          title: Lon
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceAt'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/collectors:
    get:
      tags:
      - reference
      summary: Collectors
      description: 'Collectors seen in the user''s area, built from submissions (§2.1):

        the latest self-declared snapshot, counts and last submission.'
      operationId: collectors
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CollectorSummary'
                type: array
                title: Response Collectors
      security:
      - HTTPBearer: []
  /v1/places/{place_id}:
    patch:
      tags:
      - reference
      summary: Rename Place
      description: Renames a place someone added from the map (IT admins).
      operationId: rename_place
      security:
      - HTTPBearer: []
      parameters:
      - name: place_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Place Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceRename'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - reference
      summary: Remove Place
      description: 'Removes a place someone added from the map (IT admins); devices
        drop

        it with their next sync.'
      operationId: remove_place
      security:
      - HTTPBearer: []
      parameters:
      - name: place_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Place Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sync/push:
    post:
      tags:
      - sync
      summary: Push
      description: Applies a batch; every record gets its own answer. Safe to resend.
      operationId: push
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sync/pull:
    get:
      tags:
      - sync
      summary: Pull Changes
      operationId: pull_changes
      parameters:
      - name: stream
        in: query
        required: true
        schema:
          type: string
          maxLength: 60
          title: Stream
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 60
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 500
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/attachments/{attachment_id}/upload:
    get:
      tags:
      - attachments
      summary: Upload State
      description: 'How many bytes the server holds: the phone resumes from here.'
      operationId: upload_state
      parameters:
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Attachment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadStateOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - attachments
      summary: Upload Chunk
      description: Appends up to 256 KB at `offset` (signed like every Collect request).
      operationId: upload_chunk
      parameters:
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Attachment Id
      - name: offset
        in: query
        required: true
        schema:
          type: integer
          minimum: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadStateOut'
        '409':
          description: 'offset_mismatch: resume at received_bytes'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
  /v1/attachments/{attachment_id}/complete:
    post:
      tags:
      - attachments
      summary: Complete Upload
      description: Verifies size, type and SHA-256, then stores the photo.
      operationId: complete_upload
      parameters:
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Attachment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadStateOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/attachments/{attachment_id}/content:
    get:
      tags:
      - attachments
      summary: Attachment Content
      description: The photo, for anyone who can see its source or test.
      operationId: attachment_content
      parameters:
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Attachment Id
      responses:
        '200':
          description: Successful Response
          content:
            image/jpeg: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/notifications:
    get:
      tags:
      - notifications
      summary: Inbox
      description: The signed-in user's in-app notifications, newest first.
      operationId: inbox
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inbox'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/notifications/{notification_id}/read:
    post:
      tags:
      - notifications
      summary: Mark Read
      operationId: mark_read
      security:
      - HTTPBearer: []
      parameters:
      - name: notification_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Notification Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/notifications/read-all:
    post:
      tags:
      - notifications
      summary: Mark All Read
      operationId: mark_all_read
      responses:
        '204':
          description: Successful Response
      security:
      - HTTPBearer: []
  /v1/push-tokens:
    post:
      tags:
      - notifications
      summary: Register Push Token
      description: Registers this device for push (FCM; Android and web Console).
      operationId: register_push_token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushTokenIn'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/push-tokens/{token}:
    delete:
      tags:
      - notifications
      summary: Remove Push Token
      operationId: remove_push_token
      security:
      - HTTPBearer: []
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          title: Token
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sms/inbound/{provider}:
    post:
      tags:
      - notifications
      summary: Sms Inbound
      description: 'Webhook for incoming SMS (form-encoded: ``from``, ``text``, ``id``).


        The provider does not sign callbacks, so the URL carries a secret token.

        The SMS itself must carry the installation''s HMAC code (§8.5).'
      operationId: sms_inbound
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/SmsProviderName'
      - name: token
        in: query
        required: true
        schema:
          type: string
          maxLength: 200
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsAck'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tiles/info:
    get:
      tags:
      - tiles
      summary: Info
      operationId: info
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TilesInfo'
  /v1/tiles/area.mbtiles:
    get:
      tags:
