components:
  schemas:
    AcceptanceOut:
      properties:
        side:
          type: string
          title: Side
        version:
          type: integer
          title: Version
        terms_accepted:
          type: boolean
          title: Terms Accepted
        privacy_accepted:
          type: boolean
          title: Privacy Accepted
        how:
          type: string
          title: How
        accepted_at:
          type: string
          format: date-time
          title: Accepted At
        ip:
          anyOf:
          - type: string
          - type: 'null'
          title: Ip
        device:
          anyOf:
          - type: string
          - type: 'null'
          title: Device
      type: object
      required:
      - side
      - version
      - terms_accepted
      - privacy_accepted
      - how
      - accepted_at
      - ip
      - device
      title: AcceptanceOut
    ActivateRequest:
      properties:
        code:
          type: string
          maxLength: 40
          minLength: 4
          title: Code
        platform:
          anyOf:
          - type: string
            maxLength: 40
          - type: 'null'
          title: Platform
        app_version:
          anyOf:
          - type: string
            maxLength: 40
          - type: 'null'
          title: App Version
      type: object
      required:
      - code
      title: ActivateRequest
    ActivateResponse:
      properties:
        installation_id:
          type: string
          format: uuid
          title: Installation Id
        secret:
          type: string
          title: Secret
        area:
          $ref: '#/components/schemas/AreaOut'
        server_time:
          type: string
          format: date-time
          title: Server Time
        short_code:
          type: string
          title: Short Code
      type: object
      required:
      - installation_id
      - secret
      - area
      - server_time
      - short_code
      title: ActivateResponse
    ActivationCodeOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        area:
          $ref: '#/components/schemas/AreaOut'
        expires_at:
          type: string
          format: date-time
          title: Expires At
        max_installations:
          type: integer
          title: Max Installations
        used_count:
          type: integer
          title: Used Count
        created_at:
          type: string
          format: date-time
          title: Created At
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Revoked At
      type: object
      required:
      - id
      - area
      - expires_at
      - max_installations
      - used_count
      - created_at
      - revoked_at
      title: ActivationCodeOut
    AdminUnitOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        level:
          type: string
          title: Level
        name:
          type: string
          title: Name
        code:
          type: string
          title: Code
        parent_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Parent Id
      type: object
      required:
      - id
      - level
      - name
      - code
      - parent_id
      title: AdminUnitOut
    AppearanceIn:
      properties:
        theme:
          type: string
          pattern: ^(system|light|dark)$
          title: Theme
        time_zone:
          type: string
          pattern: ^(auto|Africa/Kampala|Africa/Nairobi|UTC)$
          title: Time Zone
      type: object
      required:
      - theme
      - time_zone
      title: AppearanceIn
      description: Theme and time zone; they follow the person to any device.
    ArchiveIn:
      properties:
        entity:
          type: string
          enum:
          - installation
          - collector
          - water_source
          - test_session
          title: Entity
        record_id:
          type: string
          format: uuid
          title: Record Id
        reason:
          type: string
          maxLength: 500
          minLength: 5
          title: Reason
      type: object
      required:
      - entity
      - record_id
      - reason
      title: ArchiveIn
    ArchiveOut:
      properties:
        batch_id:
          type: string
          format: uuid
          title: Batch Id
        counts:
          additionalProperties:
            type: integer
          type: object
          title: Counts
      type: object
      required:
      - batch_id
      - counts
      title: ArchiveOut
    ArchivedItem:
      properties:
        batch_id:
          type: string
          format: uuid
          title: Batch Id
        entity:
          type: string
          title: Entity
        record_id:
          type: string
          format: uuid
          title: Record Id
        label:
          type: string
          title: Label
        reason:
          type: string
          title: Reason
        archived_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Archived By
        archived_at:
          type: string
          format: date-time
          title: Archived At
        counts:
          additionalProperties:
            type: integer
          type: object
          title: Counts
      type: object
      required:
      - batch_id
      - entity
      - record_id
      - label
      - reason
      - archived_by
      - archived_at
      - counts
      title: ArchivedItem
    Area:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        level:
          type: string
          title: Level
        name:
          type: string
          title: Name
        code:
          type: string
          title: Code
      type: object
      required:
      - id
      - level
      - name
      - code
      title: Area
    AreaOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        code:
          type: string
          title: Code
        name:
          type: string
          title: Name
        level:
          type: string
          title: Level
      type: object
      required:
      - id
      - code
      - name
      - level
      title: AreaOut
    AreaRequestIn:
      properties:
        area_ids:
          items:
            type: string
            format: uuid
          type: array
          maxItems: 20
          minItems: 1
          title: Area Ids
        reason:
          type: string
          maxLength: 500
          minLength: 3
          title: Reason
      type: object
      required:
      - area_ids
      - reason
      title: AreaRequestIn
    AreaRequestOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        user_id:
          type: string
          format: uuid
          title: User Id
        full_name:
          type: string
          title: Full Name
        areas:
          items:
            type: string
          type: array
          title: Areas
        area_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Area Ids
        current:
          items:
            type: string
          type: array
          title: Current
        reason:
          type: string
          title: Reason
        created_at:
          type: string
          format: date-time
          title: Created At
        decided_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Decided At
        approved:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Approved
      type: object
      required:
      - id
      - user_id
      - full_name
      - areas
      - area_ids
      - current
      - reason
      - created_at
      - decided_at
      - approved
      title: AreaRequestOut
    AssignAreaIn:
      properties:
        area_id:
          type: string
          format: uuid
          title: Area Id
      type: object
