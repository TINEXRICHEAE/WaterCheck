openapi: 3.1.0
info:
  title: WaterCheck API
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Health
      description: Liveness probe used by Caddy, uptime checks and the client sync
        ping.
      operationId: health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health
  /v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      operationId: login
      parameters:
      - name: X-Token-Transport
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Token-Transport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/register:
    post:
      tags:
      - auth
      summary: Register
      description: Anyone may make an account on a side; it works at once (ADR-031).
      operationId: register
      parameters:
      - name: X-Token-Transport
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Token-Transport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/join:
    post:
      tags:
      - auth
      summary: Join Side
      description: 'Opens this person''s account on another side (or signs in to it
        if it

        exists) and returns its tokens: the app switches to that side.'
      operationId: join_side
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Token-Transport
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Token-Transport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/switch:
    post:
      tags:
      - auth
      summary: Switch Side
      description: Signs in to this person's linked account on another side.
      operationId: switch_side
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Token-Transport
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Token-Transport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Refresh
      description: 'With a token in the body: from secure storage (Windows, Android).

        Without one: the web cookie (a `{}` body counts as none).'
      operationId: refresh
      parameters:
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Csrf-Token
      - name: wc_refresh
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Wc Refresh
      - name: wc_csrf
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Wc Csrf
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/RefreshRequest'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/change-password:
    post:
      tags:
      - auth
      summary: Change Password
      operationId: change_password
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Token-Transport
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Token-Transport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      operationId: logout
      parameters:
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Csrf-Token
      - name: wc_refresh
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Wc Refresh
      - name: wc_csrf
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Wc Csrf
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/RefreshRequest'
              - type: 'null'
              title: Body
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/password-help:
    post:
      tags:
      - auth
      summary: Password Help
      description: '"Forgot password": asks the IT admin for a new temporary password.

        Answers the same for unknown usernames.'
      operationId: password_help
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordHelpRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/me:
    get:
      tags:
      - auth
      summary: Me
      operationId: me
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
      security:
      - HTTPBearer: []
  /v1/me/appearance:
    put:
      tags:
      - auth
      summary: Set Appearance
      operationId: set_appearance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppearanceIn'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/me/preferences:
    put:
      tags:
      - auth
      summary: Set Preferences
      operationId: set_preferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesIn'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/installations/activate:
    post:
      tags:
      - installations
      summary: Activate
      operationId: activate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/installations/register:
    post:
      tags:
      - installations
      summary: Register
      description: A device registers itself, no code needed (ADR-024).
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/installations/me:
    get:
      tags:
      - installations
      summary: Installation Me
      operationId: installation_me
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallationMe'
  /v1/admin/activation-codes:
    get:
      tags:
      - admin
      summary: Activation Codes
      description: Recent codes; the codes themselves were shown once and are not
        stored.
      operationId: activation_codes
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ActivationCodeOut'
                type: array
                title: Response Activation Codes
      security:
      - HTTPBearer: []
    post:
      tags:
      - installations
      summary: New Activation Code
      operationId: new_activation_code
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCodeRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewCodeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/admin/installations/{installation_id}/revoke:
    post:
      tags:
      - installations
      summary: Revoke Installation
      operationId: revoke_installation
      security:
      - HTTPBearer: []
      parameters:
      - name: installation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Installation Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/reference/catalogue:
    get:
      tags:
      - reference
      summary: Catalogue
      operationId: catalogue
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalogue'
  /v1/reference/profiles:
    get:
      tags:
      - reference
      summary: Reference Profiles
      description: Published profiles as seed-format documents (custom ones come via
        sync).
      operationId: reference_profiles
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                type: array
                title: Response Reference Profiles
  /v1/reference/tester-profiles:
    get:
      tags:
      - reference
      summary: Tester Profiles
      operationId: tester_profiles
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                type: array
                title: Response Tester Profiles
  /v1/reference/response-cards:
    get:
      tags:
      - reference
      summary: Response Cards
      operationId: response_cards
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                type: array
                title: Response Response Cards
  /v1/reference/config/{key}:
    get:
      tags:
      - reference
      summary: Config
      operationId: config
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          title: Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Config
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/reference/admin-units:
    get:
      tags:
      - reference
      summary: Admin Units
      operationId: admin_units
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AdminUnitOut'
                type: array
                title: Response Admin Units
  /v1/sources/search:
    get:
      tags:
      - reference
      summary: Search Sources
      description: 'Sources anywhere, by code, name or village (ADR-019): a phone
        finds

        sources beyond the districts it holds, then syncs that district.'
      operationId: search_sources
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          title: Q
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 30
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SourceHit'
                title: Response Search Sources
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/places/search:
    get:
      tags:
      - reference
      summary: Search Places
      description: 'Places anywhere in Uganda by name: official areas, places added
        from

        devices, and the map''s villages, trading centres and neighbourhoods

        with the sub-county they lie in. Names starting with the text come

        first, then the nearest to `near_lat`/`near_lon` when given.'
      operationId: search_places
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          title: Q
      - name: near_lat
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          title: Near Lat
      - name: near_lon
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          title: Near Lon
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlaceHit'
                title: Response Search Places
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/places/locate:
    get:
      tags:
      - reference
      summary: Locate Place
      description: 'The sub-county (and its district) a point lies in, from the official

        boundaries (ADR-023). 404 outside Uganda or before the shapes load.'
      operationId: locate_place
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          title: Lat
      - name: lon
        in: query
        required: true
        schema:
          type: number
          title: Lon
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceAt'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/collectors:
    get:
      tags:
      - reference
      summary: Collectors
      description: 'Collectors seen in the user''s area, built from submissions (§2.1):

        the latest self-declared snapshot, counts and last submission.'
      operationId: collectors
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CollectorSummary'
                type: array
                title: Response Collectors
      security:
      - HTTPBearer: []
  /v1/places/{place_id}:
    patch:
      tags:
      - reference
      summary: Rename Place
      description: Renames a place someone added from the map (IT admins).
      operationId: rename_place
      security:
      - HTTPBearer: []
      parameters:
      - name: place_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Place Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceRename'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - reference
      summary: Remove Place
      description: 'Removes a place someone added from the map (IT admins); devices
        drop

        it with their next sync.'
      operationId: remove_place
      security:
      - HTTPBearer: []
      parameters:
      - name: place_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Place Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/places/ip-location:
    get:
      tags:
      - reference
      summary: Ip Location
      description: 'Roughly where the caller is, from their public address: for devices

        without GPS only (2026-10-28). 404 when the address is not known.'
      operationId: ip_location
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IpLocation'
  /v1/research/projects:
    get:
      tags:
      - research
      summary: List Projects
      description: The projects this user manages, newest first.
      operationId: list_projects
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProjectOut'
                type: array
                title: Response List Projects
      security:
      - HTTPBearer: []
    post:
      tags:
      - research
      summary: Create Project
      description: 'Anyone with a Console account may start a research project and
        owns

        it (ADR-030). The code starts its research numbers (ENT-HQ-…).'
      operationId: create_project
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/research/projects/{project_id}/forms:
    get:
      tags:
      - research
      summary: List Forms
      operationId: list_forms
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FormOut'
                title: Response List Forms
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - research
      summary: Create Form
      description: 'A new form, as a draft: built in the Console, then published.'
      operationId: create_form
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/research/forms/{form_id}:
    get:
      tags:
      - research
      summary: Get Form
      description: 'A form with its current definition (also a public or shared one,

        for viewing before cloning).'
      operationId: get_form
      security:
      - HTTPBearer: []
      parameters:
      - name: form_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Form Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - research
      summary: Update Form
      description: 'Who may see and clone the form, who may collect with it, whether
        it

        is listed, and whether it is open for collection.'
      operationId: update_form
      security:
      - HTTPBearer: []
      parameters:
      - name: form_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Form Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormPatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/research/forms/{form_id}/records:
    get:
      tags:
      - research
      summary: List Records
      description: A form's records, newest first; `q` narrows by research number.
      operationId: list_records
      security:
      - HTTPBearer: []
      parameters:
      - name: form_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Form Id
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordPage'
        '422':
