# gitleaks: default rules plus a few known-safe paths.
[extend]
useDefault = true

[allowlist]
description = "Public dev placeholders and third-party code"
paths = [
  # Placeholders the API refuses outside dev/test (ADR-009).
  '''infra/\.env\.example''',
  # Local virtualenv and build output, never committed.
  '''backend/\.venv/''',
  '''(^|/)build/''',
  '''\.dart_tool/''',
]
# Made-up collector keys (UUIDs) in test fixtures; the generic rule reads
# the field name "key" as a secret.
regexes = [
  '''0b9e1f4a-6c2d-4e8f-a1b3-c5d7e9f0c0de''',
]
