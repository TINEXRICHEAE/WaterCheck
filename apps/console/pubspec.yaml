name: watercheck_console
description: "FieldQuire Console: plan, monitor, analyse and report on field data (water testing, research and more)."
publish_to: none
version: 0.1.1+2
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  data:
    path: ../../packages/data
  domain:
    path: ../../packages/domain
  forms:
    path: ../../packages/forms
  ui_kit:
    path: ../../packages/ui_kit
  fl_chart: ^1.2.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  intl: ^0.20.3
  dio: ^5.11.1
  local_auth: ^3.0.2
  web: ^1.1.1
  api_client:
    path: ../../packages/api_client
  flutter_map: 8.3.2
  latlong2: 0.10.1
  drift: ^2.35.2
  sqlite3: 3.7.0
  path_provider: 2.1.6
  geolocator: 14.1.1
  pdf: 3.13.1
  printing: 5.15.1
  file_picker: 13.1.0
  qr: 3.0.2
  # Zips of exports and pictures (research analysis).
  archive: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Embedded in PDF reports and notices (P10).
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
