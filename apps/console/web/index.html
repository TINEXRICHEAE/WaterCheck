<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Water quality dashboard, alerts and administration.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="WaterCheck Console">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <meta name="theme-color" content="#0F172A">

  <title>WaterCheck Console</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Flutter types into a hidden field that takes the text's own size.
       Below 16px, iPhone Safari zooms the page in on every tap into a
       field and stays zoomed, cutting the edges off (2026-10-25). The
       field is invisible, so its size changes nothing on screen. */
    .flt-text-editing { font-size: 16px !important; }
    html, body { margin: 0; background: #0F172A; }
    /* Shown until the app draws its first frame: the app's own icon on its
       own colours, not a blank or browser page (2026-10-25). */
    #wc-splash {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; background: #0F172A; z-index: 10;
      transition: opacity .25s;
    }
    #wc-splash img { width: 96px; height: 96px; border-radius: 22px; }
  </style>
</head>
<body>
  <div id="wc-splash"><img src="icons/Icon-192.png" alt=""></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Installable web app (ADR-022): offline app shell, and the browser's
    // install prompt kept for the app's own "Install app" button.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
    // The browser's own install icon and banner stay (no preventDefault);
    // the event is also kept for the app's "Install app" item.
    window.wcInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      window.wcInstallPrompt = e;
    });
    window.addEventListener('appinstalled', () => { window.wcInstallPrompt = null; });
    window.wcCanInstall = () => window.wcInstallPrompt !== null;
    // iPhone and iPad Safari have no install prompt: "Add to Home Screen"
    // from the Share menu, explained in Settings. False once installed.
    window.wcIsIosBrowser = () =>
      /iPad|iPhone|iPod/.test(navigator.userAgent) && !navigator.standalone;
    window.addEventListener('flutter-first-frame', () => {
      const s = document.getElementById('wc-splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(() => s.remove(), 300);
    });
    window.wcInstall = async () => {
      const p = window.wcInstallPrompt;
      if (!p) return false;
      p.prompt();
      const choice = await p.userChoice;
      window.wcInstallPrompt = null;
      return choice.outcome === 'accepted';
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
